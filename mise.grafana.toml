# Grafana (work) machine extras.

[env]
BREW_ESCAPE_CASKS = "docker-desktop gcloud-cli"

[bootstrap.packages]
"brew:awscli" = "latest"
"brew:azure-cli" = "latest"
"brew:hashicorp/tap/terraform" = "latest"
"brew:helm" = "latest"
"brew:jsonnet" = "latest"
"brew:jsonnet-bundler" = "latest"
"brew:shellcheck" = "latest"
"brew:tanka" = "latest"
"brew:zizmor" = "latest"

"brew-cask:slack" = "latest"

[bootstrap.brew.taps]
"hashicorp/tap" = "https://github.com/hashicorp/homebrew-tap.git"

[tasks.mmdot]
# @grafana only — personal-tagged secrets never render on the work machine
description = "run mmdot (@grafana: vault-backed templates, then setup scripts)"
run = '{{ get_env(name="MMDOT_CMD", default="") }} run @grafana'

[tasks.bootstrap]
description = "Run mmdot with this machine's tag (bootstrap step 10)"
run = "mmdot run @grafana"
