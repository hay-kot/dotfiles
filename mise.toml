# Base config — active on every machine. MISE_ENV (pinned once per machine in
# ~/.config/mise/miserc.toml) selects overlays: server | dev,personal | dev,grafana

[env]
DOTFILES_DIR = "{{config_root}}"
# brew packages get no mise shims; tasks need the prefixes on PATH themselves
_.path = [
  "/opt/homebrew/bin",
  "/opt/homebrew/sbin",
  "/home/linuxbrew/.linuxbrew/bin",
  "/home/linuxbrew/.linuxbrew/sbin",
]

# ---------------------------------------------------------
# Dotfiles (replaces stow) — opt-in: only what's listed deploys

[dotfiles]
"~/.zshrc" = ".zshrc"
"~/.npmrc" = ".npmrc"
"~/.bunfig.toml" = ".bunfig.toml"
"~/.ai" = { source = ".ai", mode = "symlink-each" }
"~/.claude" = { source = ".claude", mode = "symlink-each" }
"~/.config" = { source = ".config", mode = "symlink-each" }

# ---------------------------------------------------------
# Packages — everything here must earn its place on a minimal Linux server;
# mac/workstation formulae live in mise.dev.toml

[bootstrap.packages]
"brew:age" = "latest"
"brew:bat" = "latest"
"brew:btop" = "latest"
"brew:ctop" = "latest"
"brew:eza" = "latest"
"brew:fd" = "latest"
"brew:fx" = "latest"
"brew:fzf" = "latest"
"brew:git" = "latest"
"brew:git-delta" = "latest"
"brew:go-task" = "latest"
"brew:gping" = "latest"
"brew:gum" = "latest"
"brew:jq" = "latest"
"brew:lazydocker" = "latest"
"brew:neovim" = "latest"
"brew:ripgrep" = "latest"
"brew:starship" = "latest"
"brew:tmux" = "latest"
"brew:trufflehog" = "latest"
"brew:wget" = "latest"
"brew:yq" = "latest"

# ---------------------------------------------------------
# Tasks — [tasks.bootstrap] (mise bootstrap step 10) is defined per Mac
# overlay as `mmdot run @<tag>`; the server has none and step 10 is skipped

[tasks.fmt]
description = "formats neovim files"
run = """
stylua --config-path="./.config/nvim/stylua.toml" ./.config/nvim/
"""

[tasks.xcode]
description = "setups software update and enables xcode"
run = """
sudo softwareupdate -i -a
xcode-select --install || true
sudo xcodebuild -license accept
"""

[tasks.plusx]
description = "Make all scripts in bin/ executable"
run = "chmod +x ./bin/*"

[tasks.lock]
description = "Update .config/mise/mise.lock"
dir = "./.config/mise/"
run = "mise install"

[tasks.sync]
# behind the `dotsync` alias; --ff-only so an unattended converge never
# invents a merge commit. The pull is best-effort: no network, a dead SSH
# agent, or a diverged branch must not stop the machine from converging
# against the config already checked out.
description = "Converge this machine: pull latest config, re-run bootstrap (incl. mmdot via step 10)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if ! git pull --autostash --ff-only; then
  echo "sync: git pull failed -- converging with the currently checked-out config" >&2
fi
mise bootstrap --yes
'''

[tasks.upgrade]
# Overridden by the dev overlay on Macs to also cover the brew escape casks
# and uv tools. `mise bootstrap packages upgrade` refreshes the package
# manager's metadata itself, so there is no separate `brew update`/`apt update`.
description = "Upgrade this machine: declared [bootstrap.packages] and [tools]"
run = ["mise bootstrap packages upgrade --yes", "mise upgrade"]

[tasks.stamp]
description = "Pin this machine's MISE_ENV in ~/.config/mise/miserc.toml (run once, explicitly)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ -z "${MISE_ENV:-}" ]; then
  echo "stamp: MISE_ENV is not set; run as: MISE_ENV=dev,personal mise run stamp" >&2
  exit 1
fi
mkdir -p ~/.config/mise
printf 'env = [%s]\n' "$(printf '%s' "$MISE_ENV" | tr -d '[:space:]' | sed 's/[^,]*/"&"/g')" > ~/.config/mise/miserc.toml
echo "stamp: wrote ~/.config/mise/miserc.toml -> $(cat ~/.config/mise/miserc.toml)"
'''

[tasks.encrypt]
description = "encrypt vault using mmdot"
run = "mmdot --log-level=info encrypt"

[tasks.decrypt]
description = "decrypt vault using mmdot"
run = "mmdot --log-level=info decrypt"

[tasks.mmdot]
# overlays override this with @personal / @grafana; invoke via `mise run mmdot`
description = "run mmdot (vault-backed templates, then setup scripts)"
run = "mmdot --log-level=info run"
