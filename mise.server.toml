# Server (Linux) layer. CLI tooling comes from the base layer's brew bottles.
# No [tasks.bootstrap]: mmdot never runs here, so step 10 is skipped.
# Package list is finalized on the real server during rollout.

[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:ufw" = "latest"
"apt:zsh" = "latest"

[bootstrap.user]
# login shell is actually set by the setup runbook's `sudo chsh` (unprivileged
# chsh can hit a PAM prompt mid-bootstrap); this is the declarative record
login_shell = "/usr/bin/zsh"
