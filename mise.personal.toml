# Personal-machine extras.

[env]
BREW_ESCAPE_CASKS = "docker-desktop autodesk-fusion"

[bootstrap.packages]
"brew:autorestic" = "latest"
"brew:caddy" = "latest"
"brew:hugo" = "latest"
"brew:mailpit" = "latest"
"brew:vhs" = "latest"

"brew-cask:aldente" = "latest"
"brew-cask:balenaetcher" = "latest"
"brew-cask:bambu-studio" = "latest"
"brew-cask:claudebar" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:home-assistant" = "latest"
"brew-cask:lm-studio" = "latest"
"brew-cask:pdf-expert" = "latest"
"brew-cask:proton-drive" = "latest"
"brew-cask:protonvpn" = "latest"
"brew-cask:signal" = "latest"
"brew-cask:steam" = "latest"
"brew-cask:transmit" = "latest"
"brew-cask:zwift" = "latest"

# ---------------------------------------------------------
# Tasks

[tasks.mmdot]
# @personal only — grafana's machine never renders homelab ssh config / env secrets
description = "run mmdot (@personal: vault-backed templates, then setup scripts)"
run = "mmdot --log-level=info run @personal"

[tasks.bootstrap]
description = "Run mmdot with this machine's tag (bootstrap step 10)"
run = "mmdot run @personal"
