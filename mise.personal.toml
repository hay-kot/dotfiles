# ---------------------------------------------------------
# Tasks

[tasks.mmdot]
# Overrides the base task: run only personal-tagged scripts/templates so
# grafana's machine never renders homelab ssh config / personal env secrets
# (and vice versa).
description = "run mmdot (@personal: vault-backed templates, then setup scripts)"
run = '{{ get_env(name="MMDOT_CMD", default="") }} run @personal'

[tasks.bootstrap]
# Step 10 of `mise bootstrap`: the imperative surface. mmdot renders the
# tagged templates first, then runs the tagged setup scripts sequentially —
# this is what makes `mise bootstrap --yes` a one-command converge.
description = "Run mmdot with this machine's tag (bootstrap step 10)"
run = "mmdot run @personal"

[tasks.age-key]
description = "Fetch this machine's age identity from 1Password (atomic; personal item)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# A plain `op read > key.txt` truncates the existing key BEFORE op succeeds —
# a cancelled 1Password sign-in or missing item would destroy a valid
# identity. Write to a temp file, verify content and public key, then rename
# atomically; on any failure the existing key is untouched.
# Per-overlay task: this is the PERSONAL machine's item; grafana has its own
# override (naming pattern: AGE Key MMDOT_<machine>). The server has none.
umask 077
mkdir -p ~/.age
op read 'op://Private/AGE Key MMDOT_MBP_PERSONAL/AGE/private key' > ~/.age/key.txt.tmp
test -s ~/.age/key.txt.tmp
test "$(age-keygen -y ~/.age/key.txt.tmp)" = "$(op read 'op://Private/AGE Key MMDOT_MBP_PERSONAL/AGE/public key')"
mv ~/.age/key.txt.tmp ~/.age/key.txt
'''
