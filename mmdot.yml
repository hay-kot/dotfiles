version: 2

macros:
  personal: '"personal" in tags'
  grafana: '"grafana" in tags'

variables:
  var_files:
    - ./mmdot/vault.yml?vault=true
    - ./mmdot/agents.yml

templates:
  # AI agents — rendered from the canonical definitions in mmdot/agents.yml into
  # each harness's format. Outputs are committed to the repo; mise [dotfiles]
  # symlinks .claude/agents and setup/ai.sh symlinks ~/.pi/agent/agents (~/.pi
  # holds local state, so it is excluded from [dotfiles]).
  # codex has no agent files and reviews via the shared `review` skill.
  - name: Reviewer Agent (pi)
    tags: [personal, ai]
    output: .pi/agent/agents/diff-reviewer.md
    perm: "0644"
    trim: false
    template: |
      ---
      name: diff-reviewer
      description: {{ .ai_agents.diff_reviewer.description }}
      tools: read, grep, find, ls, bash
      thinking: high
      systemPromptMode: replace
      inheritProjectContext: true
      inheritSkills: false
      defaultContext: fork
      ---

      {{ .ai_agents.diff_reviewer.body }}
  - name: Reviewer Agent (claude)
    tags: [personal, ai]
    output: .claude/agents/diff-reviewer.md
    perm: "0644"
    trim: false
    template: |
      ---
      name: diff-reviewer
      description: {{ .ai_agents.diff_reviewer.description }}
      tools: Read, Grep, Glob, Bash
      ---

      {{ .ai_agents.diff_reviewer.body }}
  - name: Host File Template
    tags: [personal]
    template: |-
      {{- range $key, $value := .homelab_ssh_config }}
      Host {{ $key }}
      {{- range $k2, $v2 := $value }}
          {{ $k2 }} {{ $v2 }}
      {{- end }}
      {{ end -}}
    output: ~/.mmdot/homelab_ssh_config
    perm: "0600"
  - name: Secrets File
    tags: [personal]
    template: |-
      {{ range $key, $value := .personal_env_secrets }}
      {{ $key }}={{ $value }}
      {{ end }}
    output: secrets/.env.local
    perm: "0600"

exec:
  shell: /bin/bash
  scripts:
    # dev
    - { path: "./setup/dirs.sh", tags: ["grafana", "personal", "dirs"] }
    - { path: "./setup/git.sh", tags: ["grafana", "personal", "git"] }
    - { path: "./setup/tmux.sh", tags: ["grafana", "personal", "tmux"] }
    - { path: "./setup/cron.sh", tags: ["grafana", "personal", "cron"] }

    # brew escape casks — mise can't install these; cask list comes from
    # BREW_ESCAPE_CASKS in the machine's mise overlay
    - { path: "./setup/brew-casks.sh", tags: ["grafana", "personal", "brew"] }

    # mac
    - { path: "./setup/mac.dock.sh", tags: ["grafana", "personal", "mac", "setup"] }
    - { path: "./setup/mac.preferences.sh", tags: ["grafana", "personal", "mac", "setup"] }
    - { path: "./setup/mac.defaults.sh", tags: ["grafana", "personal", "mac", "setup"] }

    # env & config
    - { path: "./setup/env.grafana.sh", tags: ["grafana", "env"] }
    - { path: "./setup/env.personal.sh", tags: ["personal", "env"] }
    - { path: "./setup/ssh_config.sh", tags: ["personal", "ssh"] }
    - { path: "./setup/ai.sh", tags: ["personal", "ai"] }
    # SCAFFOLD:setup-script

age:
  identity_file: ~/.age/key.txt
  recipients:
    - age1f54edfn0hwv29z5dy7f3zhtf42d08758yl84f7ypg4kat897svwsqrta6c # personal
    - age1pq5slcxq6ncpr380j3p0ng9kfwek55leexea55prjx7yvw3h6gms7ly6nt # grafana
  files:
    - src: secrets/design-doc-template.md.age
      dest: .ai/skills/design-doc/templates/design-doc.md
