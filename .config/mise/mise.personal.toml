# Personal-machine tools.

[tools]
# pra uploads PR screenshots and recordings to a personal public bucket
# (README: PR screenshots and recordings).
# Exempt from minimum_release_age until 2026-11-30, when 0.1.0 is 7 days old:
# delete minimum_release_age here then. It applies to whatever version this
# entry pins, so do not bump the version while it is still here.
"github:hay-kot/prassets" = { version = "0.1.0", minimum_release_age = "0d" }
# bin/pr-record loads Playwright from this install when the repo it runs in
# has none of its own.
"npm:playwright" = "1.65.1"
