# Global mise config — base layer, active everywhere. Machine tool sets live
# in mise.{dev,personal,grafana}.toml beside this file, selected by miserc.toml.

[settings]
minimum_release_age = "3d"
idiomatic_version_file_enable_tools = ["python"]
experimental = true
lockfile = true

  [settings.npm]
  # use bun as the package manager for 'npm' register
  bun = true
