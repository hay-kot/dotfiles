# yaml-language-server: $schema=https://raw.githubusercontent.com/hay-kot/prassets/main/schema.json
#
# pra config for PR screenshots and recordings (docs/pr-assets.md). The bucket
# is public, so there is no default entry: a repo can upload only when it is
# listed under repos. Never add a work or private repo.
#
# The key lives in 1Password; setup/prassets.sh copies it into the login
# keychain on dotsync.
stores:
  agent-pr-assets:
    endpoint: bce6b95e4e84d92b1972d3b55b6cfaf6.r2.cloudflarestorage.com
    bucket: agent-pr-assets
    public_url: https://pub-c5217d9e2b874f9e8a4f81116a0c1813.r2.dev
    access_key: '{{ cmd "security find-generic-password -s pra-agent-assets -a access_key -w" }}'
    secret_key: '{{ cmd "security find-generic-password -s pra-agent-assets -a secret_key -w" }}'

# Every key starts with pr/ so that one R2 lifecycle rule on pr/ expires the
# assets of every repo after 30 days. pra always puts the entry prefix first,
# so the shared segment must be in the prefix, and the pr type drops its own
# pr/ to avoid pr/<repo>/pr/. Types from a repo's .prassets.yaml also land
# under pr/ and expire: this bucket holds throwaway PR media only.
#
# To enable a repo, add a line: github.com/<owner>/<repo>: *pr-assets
repos:
  github.com/colonyops/hive: &pr-assets
    store: agent-pr-assets
    prefix: "pr/{{ .Host }}/{{ .Owner }}/{{ .Repo }}/"
    pr:
      key: "{{ .Branch }}/{{ .File }}"
      usage: "screenshots and screen recordings for one pull request; public, deleted after 30 days"
